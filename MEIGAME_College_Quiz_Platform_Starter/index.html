<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEIGAME — College Quiz Platform</title>
<meta name="theme-color" content="#071a45">
<style>
:root{
  --navy:#06153b;--blue:#075de8;--cyan:#18c7ff;--ink:#0b1833;--muted:#64748b;
  --bg:#eef4ff;--surface:#fff;--line:#dbe5f5;--green:#16a34a;--red:#dc2626;--amber:#f59e0b;
  --shadow:0 18px 50px rgba(7,34,91,.12);--radius:22px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:
radial-gradient(circle at 10% 0%,rgba(24,199,255,.14),transparent 30%),
radial-gradient(circle at 100% 20%,rgba(7,93,232,.12),transparent 35%),var(--bg)}
button,input,select,textarea{font:inherit} button{cursor:pointer;border:0}
.hidden{display:none!important}.app{min-height:100vh}.topbar{height:72px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-weight:900}.brand img{height:52px;width:52px;object-fit:contain}.brand span{letter-spacing:.08em}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 72px)}.sidebar{background:linear-gradient(180deg,#06153b,#0a2457);color:#fff;padding:20px 14px;position:sticky;top:72px;height:calc(100vh - 72px)}
.navbtn{width:100%;text-align:left;padding:13px 14px;margin:4px 0;background:transparent;color:#dce9ff;border-radius:14px}.navbtn:hover,.navbtn.active{background:rgba(255,255,255,.11);color:#fff}
.main{padding:30px;max-width:1500px;width:100%;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.pagehead h1{margin:0;font-size:clamp(26px,3vw,40px)}.muted{color:var(--muted)}
.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);transition:.22s transform,.22s box-shadow}.card:hover{transform:translateY(-3px);box-shadow:0 24px 60px rgba(7,34,91,.16)}
.stat .label{font-size:13px;color:var(--muted);font-weight:700}.stat .value{font-size:34px;font-weight:900;margin-top:8px}
.btn{padding:11px 16px;border-radius:13px;font-weight:800}.primary{background:linear-gradient(135deg,var(--blue),#063aab);color:#fff;box-shadow:0 10px 22px rgba(7,93,232,.25)}.secondary{background:#eaf2ff;color:#0b3c92}.danger{background:#fee2e2;color:#991b1b}.ghost{background:transparent;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#eaf2ff;color:#0b3c92}.success{background:#dcfce7;color:#166534}.warning{background:#fef3c7;color:#92400e}.error{background:#fee2e2;color:#991b1b}
.form{display:grid;gap:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(7,93,232,.1)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginbox{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;padding:34px;box-shadow:0 30px 90px rgba(7,34,91,.2)}.loginlogo{width:170px;height:170px;object-fit:contain;display:block;margin:0 auto 10px}.login h1{text-align:center;margin:0}.login p{text-align:center;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;padding:14px 18px;border-radius:14px;background:#071a45;color:#fff;box-shadow:var(--shadow);z-index:99}
.modal{position:fixed;inset:0;background:rgba(3,13,36,.58);display:grid;place-items:center;padding:20px;z-index:50}.modalbox{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:24px}
.quizscreen{min-height:100vh;display:grid;place-items:center;padding:22px}.quizbox{width:min(920px,100%)}.question{font-size:clamp(25px,4vw,46px);font-weight:900;line-height:1.08}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}.answer{min-height:90px;padding:18px;text-align:left;border-radius:18px;background:#fff;border:2px solid var(--line);font-weight:800;box-shadow:var(--shadow)}.answer.selected{border-color:var(--blue);background:#eaf2ff}.timer{font-size:26px;font-weight:900;color:var(--blue)}.progress{height:8px;background:#dce7f8;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:.3s}
.hero{background:linear-gradient(135deg,#071a45,#0a4ab8);color:#fff;border-radius:28px;padding:30px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-100px;background:rgba(24,199,255,.18)}.hero h2{font-size:34px;margin:0 0 8px}.hero p{color:#cfe0ff;max-width:700px}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr 1fr}.layout{grid-template-columns:210px 1fr}}
@media(max-width:760px){.layout{display:block}.sidebar{position:fixed;left:-260px;top:72px;width:250px;z-index:30;transition:.25s}.sidebar.open{left:0}.main{padding:18px}.stats,.cards,.formgrid{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.topbar{padding:0 14px}.brand span{display:none}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast hidden"></div><div id="modal" class="modal hidden"></div>
<script>
const LOGO="meigame-logo.png";
const ADMIN_USERS=[
 {id:"a1",name:"MECPrajan",username:"mecprajan",role:"SUPER_ADMIN",password:"mahendra@123",status:"Active",department:"IT"},
 {id:"a2",name:"MEC Raju",username:"mecraju",role:"SUPER_ADMIN",password:"mahendra@123",status:"Active",department:"IT"}
];
const seedQuiz={id:"q1",title:"IT Fundamentals Challenge",description:"A sample college quiz. Replace it from the Quiz Builder.",subject:"Information Technology",department:"IT",year:"2",status:"PUBLISHED",joinCode:"MEG-7K4P",resultVisibility:true,leaderboard:true,questions:[
 {id:"qq1",text:"Which language is primarily used to structure web pages?",type:"MCQ",points:10,time:20,options:["Python","HTML","SQL","C"],correct:1},
 {id:"qq2",text:"CSS is used to style web pages.",type:"TF",points:10,time:15,options:["True","False"],correct:0}
]};
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
if(!localStorage.getItem("meigame_users")) save("meigame_users",[]);
if(!localStorage.getItem("meigame_staff")) save("meigame_staff",[]);
if(!localStorage.getItem("meigame_quizzes")) save("meigame_quizzes",[seedQuiz]);
if(!localStorage.getItem("meigame_logs")) save("meigame_logs",[]);
let session=load("meigame_session",null), currentPage="dashboard", participant=null;
function users(){return load("meigame_users",[])} function staff(){return load("meigame_staff",[])} function quizzes(){return load("meigame_quizzes",[])} function logs(){return load("meigame_logs",[])}
function actor(){return session?.username||"public"}
function log(action,target,status="SUCCESS",meta=""){let x=logs();x.unshift({id:crypto.randomUUID(),actor:actor(),role:session?.role||"PARTICIPANT",action,target,status,time:new Date().toLocaleString(),meta});save("meigame_logs",x.slice(0,500))}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),2500)}
function escape(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function loginView(){document.getElementById("app").innerHTML=`<div class="login"><div class="loginbox"><img class="loginlogo" src="${LOGO}"><h1>MEIGAME</h1><p>Private College Quiz Platform</p><form class="form" onsubmit="doLogin(event)"><div class="field"><label>Username</label><input id="lu" autocomplete="username" required></div><div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password" required></div><button class="btn primary">Sign in</button><small class="muted">Initial Super Admins: mecprajan / mecraju</small></form></div></div>`}
function doLogin(e){e.preventDefault();let u=document.getElementById("lu").value.trim(),p=document.getElementById("lp").value;
let found=ADMIN_USERS.find(x=>x.username===u&&x.password===p)||staff().find(x=>x.username===u&&x.password===p)||users().find(x=>x.username===u&&x.password===p);
if(!found){log("FAILED_LOGIN",u,"FAILED");toast("Invalid username or password");return}
if(found.status==="Inactive"){toast("Account is inactive");return}
session={id:found.id,username:found.username,role:found.role,name:found.name};save("meigame_session",session);log("LOGIN",found.username);render()}
function shell(){
const role=session.role;const admin=role==="SUPER_ADMIN", canQuiz=admin||role==="STAFF";
const nav=[["dashboard","Dashboard"],["quizzes","Quizzes"],["results","Results"],...(admin?[["users","Users"],["staff","Staff"],["analytics","Analytics"],["logs","Audit Logs"],["settings","Settings"]]:[])].filter(x=>!(!canQuiz&&x[0]==="quizzes"));
return `<div class="topbar"><div class="brand"><button class="btn ghost" onclick="toggleSide()">☰</button><img src="${LOGO}"><span>MEIGAME</span></div><div class="row"><span class="badge">${role.replace("_"," ")}</span><span>${escape(session.name)}</span><button class="btn secondary" onclick="logout()">Logout</button></div></div><div class="layout"><aside class="sidebar" id="side">${nav.map(n=>`<button class="navbtn ${currentPage===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join("")}</aside><main class="main" id="main"></main></div>`}
function go(p){currentPage=p;render()}
function logout(){log("LOGOUT",session.username);session=null;localStorage.removeItem("meigame_session");render()}
function render(){if(!session){loginView();return}document.getElementById("app").innerHTML=shell();renderPage()}
function toggleSide(){document.getElementById("side")?.classList.toggle("open")}
function renderPage(){
const m=document.getElementById("main"); if(currentPage==="dashboard")m.innerHTML=dashboard(); else if(currentPage==="quizzes")m.innerHTML=quizPage(); else if(currentPage==="users")m.innerHTML=userPage(); else if(currentPage==="staff")m.innerHTML=staffPage(); else if(currentPage==="logs")m.innerHTML=logPage(); else if(currentPage==="analytics")m.innerHTML=analyticsPage(); else if(currentPage==="results")m.innerHTML=resultPage(); else m.innerHTML=settingsPage()
}
function dashboard(){let qs=quizzes(),us=users(),st=staff(),attempts=load("meigame_attempts",[]);return `<div class="pagehead"><div><h1>Dashboard</h1><p class="muted">College quiz operations at a glance.</p></div><button class="btn primary" onclick="go('quizzes')">Manage Quizzes</button></div><div class="grid stats">${stat("Total Users",us.length)}${stat("Staff Members",st.length)}${stat("Published Quizzes",qs.filter(q=>q.status==="PUBLISHED").length)}${stat("Quiz Attempts",attempts.length)}</div><div class="grid cards" style="margin-top:18px"><div class="hero" style="grid-column:span 2"><h2>Play · Learn · Win</h2><p>MEIGAME is a private college quiz platform built around secure quiz sessions, controlled access and meaningful academic analytics.</p></div><div class="card"><b>Quick actions</b><div class="row" style="margin-top:16px"><button class="btn secondary" onclick="openQuizModal()">Create Quiz</button>${session.role==="SUPER_ADMIN"?`<button class="btn secondary" onclick="openUserModal()">Add User</button>`:""}</div></div></div>`}
function stat(a,b){return `<div class="card stat"><div class="label">${a}</div><div class="value">${b}</div></div>`}
function quizPage(){let qs=quizzes();return `<div class="pagehead"><div><h1>Quizzes</h1><p class="muted">Create, publish and launch college quizzes.</p></div><button class="btn primary" onclick="openQuizModal()">+ Create Quiz</button></div><div class="card tablewrap"><table class="table"><thead><tr><th>Title</th><th>Subject</th><th>Status</th><th>Join Code</th><th>Actions</th></tr></thead><tbody>${qs.map(q=>`<tr><td><b>${escape(q.title)}</b><br><small class="muted">${escape(q.description)}</small></td><td>${escape(q.subject)}</td><td><span class="badge ${q.status==="PUBLISHED"?"success":"warning"}">${q.status}</span></td><td><b>${q.joinCode}</b></td><td><div class="row"><button class="btn secondary" onclick="launch('${q.id}')">Launch</button><button class="btn secondary" onclick="copyJoin('${q.joinCode}')">Copy Link</button>${session.role==="SUPER_ADMIN"?`<button class="btn danger" onclick="deleteQuiz('${q.id}')">Delete</button>`:""}</div></td></tr>`).join("")}</tbody></table></div>`}
function openQuizModal(){document.getElementById("modal").innerHTML=`<div class="modalbox"><div class="pagehead"><h2>Create Quiz</h2><button class="btn ghost" onclick="closeModal()">✕</button></div><form class="form" onsubmit="createQuiz(event)"><div class="formgrid"><div class="field"><label>Quiz Title</label><input id="qt" required></div><div class="field"><label>Subject</label><input id="qs" required></div><div class="field"><label>Department</label><input id="qd" value="IT"></div><div class="field"><label>Year</label><input id="qy" value="2"></div></div><div class="field"><label>Description</label><textarea id="qdesc" rows="3"></textarea></div><div class="field"><label>Question 1</label><textarea id="qq" rows="3" required></textarea></div><div class="formgrid"><div class="field"><label>Option A</label><input id="oa" required></div><div class="field"><label>Option B</label><input id="ob" required></div><div class="field"><label>Option C</label><input id="oc" required></div><div class="field"><label>Option D</label><input id="od" required></div></div><div class="formgrid"><div class="field"><label>Correct option</label><select id="co"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div class="field"><label>Time limit (seconds)</label><input id="tm" type="number" min="5" value="20"></div></div><div class="row"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Create & Publish</button></div></form></div>`;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function createQuiz(e){e.preventDefault();let q={id:crypto.randomUUID(),title:qt.value,description:qdesc.value,subject:qs.value,department:qd.value,year:qy.value,status:"PUBLISHED",joinCode:"MEG-"+Math.random().toString(36).slice(2,6).toUpperCase(),resultVisibility:true,leaderboard:true,questions:[{id:crypto.randomUUID(),text:qq.value,type:"MCQ",points:10,time:+tm.value,options:[oa.value,ob.value,oc.value,od.value],correct:+co.value}]};let x=quizzes();x.unshift(q);save("meigame_quizzes",x);log("QUIZ_CREATED",q.title);closeModal();toast("Quiz created");render()}
function deleteQuiz(id){if(!confirm("Delete this quiz?"))return;let q=quizzes().find(x=>x.id===id);save("meigame_quizzes",quizzes().filter(x=>x.id!==id));log("QUIZ_DELETED",q?.title);toast("Quiz deleted");render()}
function copyJoin(code){navigator.clipboard?.writeText(location.href.split("#")[0]+"#join="+code);toast("Join link copied")}
function launch(id){let q=quizzes().find(x=>x.id===id);if(!q)return;copyJoin(q.joinCode);location.hash="join="+q.joinCode}
function userPage(){let us=users();return `<div class="pagehead"><div><h1>Users</h1><p class="muted">Registered college accounts. Only Super Admin can manage users.</p></div><button class="btn primary" onclick="openUserModal()">+ Add User</button></div><div class="card tablewrap"><table class="table"><thead><tr><th>Name</th><th>Username</th><th>College ID</th><th>Department</th><th>Status</th><th>Action</th></tr></thead><tbody>${us.map(u=>`<tr><td>${escape(u.name)}</td><td>${escape(u.username)}</td><td>${escape(u.collegeId)}</td><td>${escape(u.department)}</td><td><span class="badge ${u.status==="Active"?"success":"error"}">${u.status}</span></td><td><button class="btn danger" onclick="deleteUser('${u.id}')">Delete</button></td></tr>`).join("")||`<tr><td colspan="6" class="muted">No registered users.</td></tr>`}</tbody></table></div>`}
function openUserModal(){document.getElementById("modal").innerHTML=`<div class="modalbox"><div class="pagehead"><h2>Add User</h2><button class="btn ghost" onclick="closeModal()">✕</button></div><form class="form" onsubmit="createUser(event)"><div class="formgrid"><div class="field"><label>Full Name</label><input id="un" required></div><div class="field"><label>Username</label><input id="uu" required></div><div class="field"><label>College ID / Register Number</label><input id="uc" required></div><div class="field"><label>Department</label><input id="ud" value="IT" required></div><div class="field"><label>Year</label><input id="uy" value="2"></div><div class="field"><label>Section</label><input id="usec" value="A"></div></div><p class="muted">Initial password: <b>mahendra@123</b>. Store passwords hashed in the production backend.</p><div class="row"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Create User</button></div></form></div>`;document.getElementById("modal").classList.remove("hidden")}
function createUser(e){e.preventDefault();let x=users();if(x.some(u=>u.username===uu.value)||ADMIN_USERS.some(u=>u.username===uu.value)||staff().some(u=>u.username===uu.value)){toast("Username already exists");return}let u={id:crypto.randomUUID(),name:un.value,username:uu.value,collegeId:uc.value,department:ud.value,year:uy.value,section:usec.value,status:"Active",role:"USER",password:"mahendra@123",created:new Date().toISOString()};x.push(u);save("meigame_users",x);log("USER_CREATED",u.username);closeModal();toast("User created");render()}
function deleteUser(id){if(!confirm("Delete this user?"))return;let u=users().find(x=>x.id===id);save("meigame_users",users().filter(x=>x.id!==id));log("USER_DELETED",u?.username);toast("User deleted");render()}
function staffPage(){let st=staff();return `<div class="pagehead"><div><h1>Staff</h1><p class="muted">Co-admin accounts and permissions.</p></div><button class="btn primary" onclick="openStaffModal()">+ Add Staff</button></div><div class="card tablewrap"><table class="table"><thead><tr><th>Name</th><th>Username</th><th>Permissions</th><th>Status</th><th>Action</th></tr></thead><tbody>${st.map(s=>`<tr><td>${escape(s.name)}</td><td>${escape(s.username)}</td><td>${s.permissions.join(", ")}</td><td><span class="badge ${s.status==="Active"?"success":"error"}">${s.status}</span></td><td><button class="btn danger" onclick="deleteStaff('${s.id}')">Delete</button></td></tr>`).join("")||`<tr><td colspan="5" class="muted">No staff accounts.</td></tr>`}</tbody></table></div>`}
function openStaffModal(){document.getElementById("modal").innerHTML=`<div class="modalbox"><div class="pagehead"><h2>Add Staff</h2><button class="btn ghost" onclick="closeModal()">✕</button></div><form class="form" onsubmit="createStaff(event)"><div class="formgrid"><div class="field"><label>Name</label><input id="sn" required></div><div class="field"><label>Username</label><input id="su" required></div></div><div class="field"><label>Permissions</label><select id="sp" multiple size="5"><option selected>Create Quiz</option><option selected>Edit Quiz</option><option>Delete Quiz</option><option selected>Start Quiz</option><option selected>View Results</option></select></div><p class="muted">Staff can never create users, manage staff or become Super Admin.</p><div class="row"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Create Staff</button></div></form></div>`;document.getElementById("modal").classList.remove("hidden")}
function createStaff(e){e.preventDefault();let vals=[...sp.selectedOptions].map(o=>o.value),x=staff();if([...ADMIN_USERS,...users(),...x].some(u=>u.username===su.value)){toast("Username already exists");return}x.push({id:crypto.randomUUID(),name:sn.value,username:su.value,role:"STAFF",password:"mahendra@123",status:"Active",permissions:vals});save("meigame_staff",x);log("STAFF_CREATED",su.value);closeModal();toast("Staff created");render()}
function deleteStaff(id){if(!confirm("Delete this staff account?"))return;let s=staff().find(x=>x.id===id);save("meigame_staff",staff().filter(x=>x.id!==id));log("STAFF_DELETED",s?.username);toast("Staff deleted");render()}
function logPage(){return `<div class="pagehead"><div><h1>Audit Logs</h1><p class="muted">Security and operational activity.</p></div></div><div class="card tablewrap"><table class="table"><thead><tr><th>Time</th><th>Actor</th><th>Role</th><th>Action</th><th>Target</th><th>Status</th></tr></thead><tbody>${logs().map(l=>`<tr><td>${escape(l.time)}</td><td>${escape(l.actor)}</td><td>${escape(l.role)}</td><td>${escape(l.action)}</td><td>${escape(l.target)}</td><td><span class="badge ${l.status==="SUCCESS"?"success":"error"}">${l.status}</span></td></tr>`).join("")}</tbody></table></div>`}
function analyticsPage(){let a=load("meigame_attempts",[]),avg=a.length?(a.reduce((s,x)=>s+x.score,0)/a.length).toFixed(1):"0";return `<div class="pagehead"><div><h1>Analytics</h1><p class="muted">Only real recorded attempts are used.</p></div></div><div class="grid stats">${stat("Attempts",a.length)}${stat("Average Score",avg)}${stat("Highest Score",a.length?Math.max(...a.map(x=>x.score)):0)}${stat("Completed",a.filter(x=>x.completed).length)}</div><div class="card" style="margin-top:18px"><h3>Recent attempts</h3><div class="tablewrap"><table class="table"><thead><tr><th>Participant</th><th>Quiz</th><th>Score</th><th>Accuracy</th><th>Time</th></tr></thead><tbody>${a.slice(0,20).map(x=>`<tr><td>${escape(x.name)}</td><td>${escape(x.quizTitle)}</td><td>${x.score}</td><td>${x.accuracy}%</td><td>${x.time}s</td></tr>`).join("")||`<tr><td colspan="5" class="muted">No attempts recorded yet.</td></tr>`}</tbody></table></div></div>`}
function resultPage(){return analyticsPage()}
function settingsPage(){return `<div class="pagehead"><div><h1>Settings</h1><p class="muted">College-level configuration.</p></div></div><div class="card"><h3>MEIGAME security baseline</h3><p>Public registration is disabled. Initial administrator accounts are fixed in this demo. Production deployment must move authentication, authorization, quiz scoring and database access to a secure server.</p><div class="row"><span class="badge success">RBAC UI enabled</span><span class="badge success">Participant isolation</span><span class="badge success">Audit logging</span></div></div>`}
function participantView(code){let q=quizzes().find(x=>x.joinCode===code&&["PUBLISHED","LIVE"].includes(x.status));if(!q){document.getElementById("app").innerHTML=`<div class="quizscreen"><div class="card"><h1>Quiz unavailable</h1><p class="muted">This quiz link is invalid, unpublished or expired.</p></div></div>`;return}
participant={q,index:0,answers:[],name:""};showJoin(q)}
function showJoin(q){document.getElementById("app").innerHTML=`<div class="quizscreen"><div class="quizbox card"><img src="${LOGO}" style="width:90px;height:90px;object-fit:contain"><h1>${escape(q.title)}</h1><p class="muted">${escape(q.description)}</p><form class="form" onsubmit="startParticipant(event)"><div class="field"><label>Participant name</label><input id="pn" required></div><div class="field"><label>College ID / Register Number</label><input id="pc" required></div><button class="btn primary">Join Quiz</button></form></div></div>`}
function startParticipant(e){e.preventDefault();participant.name=pn.value;participant.collegeId=pc.value;participant.started=Date.now();log("PARTICIPANT_JOINED",participant.q.joinCode);showQuestion()}
function showQuestion(){let p=participant,q=p.q,qu=q.questions[p.index];let pct=(p.index/q.questions.length)*100;document.getElementById("app").innerHTML=`<div class="quizscreen"><div class="quizbox"><div class="row" style="justify-content:space-between"><b>MEIGAME</b><span class="timer" id="timer">${qu.time}s</span></div><div class="progress" style="margin:14px 0 24px"><i style="width:${pct}%"></i></div><p class="muted">Question ${p.index+1} of ${q.questions.length}</p><div class="question">${escape(qu.text)}</div><div class="answers">${qu.options.map((o,i)=>`<button class="answer" onclick="choose(${i})" id="ans${i}">${String.fromCharCode(65+i)}. ${escape(o)}</button>`).join("")}</div><div class="row" style="justify-content:space-between;margin-top:24px"><span class="muted">Answer and continue</span><button class="btn primary" onclick="nextQuestion()">Next</button></div></div></div>`;participant.choice=null;let left=qu.time;participant.timer=setInterval(()=>{left--;let t=document.getElementById("timer");if(t)t.textContent=left+"s";if(left<=0){clearInterval(participant.timer);nextQuestion()}},1000)}
function choose(i){participant.choice=i;document.querySelectorAll(".answer").forEach((b,n)=>b.classList.toggle("selected",n===i))}
function nextQuestion(){clearInterval(participant.timer);if(participant.choice==null){toast("Select an answer");return}participant.answers.push(participant.choice);participant.index++;if(participant.index<participant.q.questions.length)showQuestion();else finishQuiz()}
function finishQuiz(){let q=participant.q,correct=0;q.questions.forEach((x,i)=>{if(participant.answers[i]===x.correct)correct++});let score=correct*10,total=q.questions.length*10,accuracy=Math.round(correct/q.questions.length*100),time=Math.round((Date.now()-participant.started)/1000);let attempts=load("meigame_attempts",[]);attempts.unshift({id:crypto.randomUUID(),name:participant.name,collegeId:participant.collegeId,quizTitle:q.title,score,total,accuracy,time,completed:true});save("meigame_attempts",attempts);log("QUIZ_COMPLETED",q.joinCode);document.getElementById("app").innerHTML=`<div class="quizscreen"><div class="card" style="width:min(620px,100%);text-align:center"><img src="${LOGO}" style="width:110px;height:110px;object-fit:contain"><h1>Quiz Completed</h1><p class="muted">Well done, ${escape(participant.name)}.</p>${q.resultVisibility?`<div class="grid stats"><div class="card"><div class="label">Score</div><div class="value">${score}/${total}</div></div><div class="card"><div class="label">Accuracy</div><div class="value">${accuracy}%</div></div></div>`:`<p class="badge">Results are hidden by the quiz administrator.</p>`}<p class="muted">You may close this page.</p></div></div>`}
function route(){let h=location.hash;if(h.startsWith("#join=")){session=null;participantView(decodeURIComponent(h.slice(6)));return}render()}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
