services:
  postgres:
    image: postgres:16-alpine
    container_name: meigame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meigame
      POSTGRES_PASSWORD: meigame
      POSTGRES_DB: meigame
    ports:
      - "5432:5432"
    volumes:
      - meigame_pgdata:/var/lib/postgresql/data
volumes:
  meigame_pgdata:
